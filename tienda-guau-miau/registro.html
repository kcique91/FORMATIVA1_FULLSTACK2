<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guau&Miau - Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <nav>
        <a href="index.html" class="logo">HOME</a>
        <a href="catalogo.html" class="link-catalogo">Catálogo</a>
        <h1>GUAU&MIAU</h1>
        <a href="index.html" class="btn-nav">INICIAR SESIÓN</a>
    </nav>
</header>
<main>
    <section class="form-container">
        <h2>Registro de Usuario</h2>
        <form id="formRegistro" novalidate>
            
            <div class="form-group">
                <label for="nombreCompleto">Nombre Completo</label>
                <input 
                    type="text" 
                    id="nombreCompleto" 
                    name="nombreCompleto" 
                    placeholder="Ej: Ana Pérez"
                    autocomplete="name"
                    maxlength="50"
                    required>
                <span class="error-mensaje" id="errorNombre"></span>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo" 
                    placeholder="usuario@duoc.cl"
                    autocomplete="email"
                    required>
                <span class="error-mensaje" id="errorCorreo"></span>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input 
                    type="password" 
                    id="contrasena" 
                    name="contrasena" 
                    autocomplete="new-password"
                    required>
                <span class="error-mensaje" id="errorContrasena"></span>
            </div>

            <div class="form-group">
                <label for="confirmarContrasena">Confirmar Contraseña</label>
                <input 
                    type="password" 
                    id="confirmarContrasena" 
                    name="confirmarContrasena" 
                    autocomplete="new-password"
                    required>
                <span class="error-mensaje" id="errorConfirmarContrasena"></span>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (opcional)</label>
                <input 
                    type="tel" 
                    id="telefono" 
                    name="telefono" 
                    placeholder="+56 9 1234 5678"
                    autocomplete="tel">
                <span class="error-mensaje" id="errorTelefono"></span>
            </div>
            <div class="mascotas-header">
                <h3>Registro de Mascotas</h3>
                <button type="button" id="btnAnadirMascota" class="btn-secundario">
                    Añadir Nuevo Registro
                </button>
            </div>

            <div id="contenedorMascotas">
            </div>

            <button type="submit" class="btn-primario">Registrar</button>

        </form>
    </section>
</main>
<footer>
    <p>&copy; 2026 Guau&Miau - Tienda de juguetes para mascotas</p>
    <p>Contacto: contacto@guaumiau.cl | Teléfono: +56 9 1234 5678</p>
</footer>
<script src="js/validaciones.js"></script>
</body>
</html>
